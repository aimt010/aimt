name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v0.1.0)'
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-2022
            archive: zip

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package (Unix tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          staging="aimt-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/aimt" "$staging/aimt"
          # Windows binary is aimt.exe, Unix is aimt
          tar -czf "aimt-${{ matrix.target }}.tar.gz" -C "$staging" aimt
          ls -lh "aimt-${{ matrix.target }}.tar.gz"
          tar -tzf "aimt-${{ matrix.target }}.tar.gz"

      - name: Package (Windows zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "aimt-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aimt.exe" "$staging/aimt.exe"
          Compress-Archive -Path "$staging/aimt.exe" -DestinationPath "aimt-${{ matrix.target }}.zip" -Force
          Get-ChildItem "aimt-${{ matrix.target }}.zip" | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: aimt-${{ matrix.target }}
          path: |
            aimt-${{ matrix.target }}.tar.gz
            aimt-${{ matrix.target }}.zip
          if-no-files-found: warn

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: |
          ls -R dist
          cp dist/*.tar.gz . 2>/dev/null || true
          cp dist/*.zip . 2>/dev/null || true
          ls -lh *.tar.gz *.zip 2>/dev/null || true

      - name: Prepare install scripts as release assets
        run: |
          cp scripts/install.sh install.sh
          cp scripts/install.ps1 install.ps1
          ls -lh install.sh install.ps1

      - name: Generate checksums.txt
        run: |
          set -euo pipefail
          rm -f checksums.txt
          # Use exact archives that will be uploaded; fail if none
          shopt -s nullglob
          archives=(aimt-*.tar.gz aimt-*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "Failed to generate checksums: no archives found" >&2
            exit 1
          fi
          for f in "${archives[@]}"; do
            # Linux runner: sha256sum is native; macOS would use shasum -a 256, Windows Get-FileHash
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" >> checksums.txt
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$f" >> checksums.txt
            else
              echo "No SHA256 tool found" >&2
              exit 1
            fi
          done
          cat checksums.txt
          # Validate format: 64 hex, two spaces, filename
          if ! grep -Eq '^[0-9a-fA-F]{64}  aimt-.+\.(tar\.gz|zip)$' checksums.txt; then
            echo "Malformed checksums.txt" >&2
            cat checksums.txt >&2
            exit 1
          fi
          echo "Generated $(wc -l < checksums.txt) checksums"
          ls -lh checksums.txt

      - name: Attest release archives
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            aimt-*.tar.gz
            aimt-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            aimt-*.tar.gz
            aimt-*.zip
            checksums.txt
            install.sh
            install.ps1
          generate_release_notes: true
          fail_on_unmatched_files: false
